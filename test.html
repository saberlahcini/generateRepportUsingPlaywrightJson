<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
	<style>
        
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Arial, sans-serif; background: #f2f5fb; color: #202b3c; }
		.card { width: min(100%, 380px); padding: 36px; background: white; border-radius: 16px; box-shadow: 0 12px 36px #20335418; }
		h1 { margin: 0 0 8px; font-size: 28px; }
		.welcome { margin: 0 0 28px; color: #68758a; }
		label { display: block; margin: 16px 0 7px; font-size: 14px; font-weight: 600; }
		input { width: 100%; padding: 12px 14px; border: 1px solid #d8deea; border-radius: 8px; font: inherit; }
		input:focus { outline: 2px solid #829cf5; border-color: transparent; }
		button { width: 100%; margin-top: 24px; padding: 13px; border: 0; border-radius: 8px; background: #4263eb; color: white; font: inherit; font-weight: 700; cursor: pointer; }
		button:hover { background: #3451ca; }
	</style>
</head>
<body>
	<main class="card">
		<h1>Welcome back</h1>
		<p class="welcome">Hiiw, Saber Lahcini! Please log in.</p>
		<form>
			<label for="email">Email</label>
			<input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
			<label for="password">Password</label>
			<input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
			<button type="submit">Log in</button>
		</form>
	</main>
</body>
</html>
